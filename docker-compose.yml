services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velocitybook
      POSTGRES_USER: vb_user
      POSTGRES_PASSWORD: vb_pass
    ports:
      - "5433:5432"
    volumes:
      - ./packages/backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./packages/backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vb_user -d velocitybook"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./packages/backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://vb_user:vb_pass@postgres:5432/velocitybook
      REDIS_URL: redis://redis:6379
      PORT: "3001"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./packages/frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    depends_on:
      - backend

volumes:
  pgdata:
