services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velocitybook
      POSTGRES_USER: vb_user
      POSTGRES_PASSWORD: vb_pass
    ports:
      - "5433:5432"
    volumes:
      - ./packages/backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./packages/backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vb_user -d velocitybook"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ─── Sharded Matching Engine Workers ─────────────────────────────

  engine-worker-1:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    command: ["node", "dist/workers/EngineWorker.js"]
    environment:
      WORKER_ID: worker-1
      ASSIGNED_SYMBOLS: BTC-USD,BTC-INR
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  engine-worker-2:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    command: ["node", "dist/workers/EngineWorker.js"]
    environment:
      WORKER_ID: worker-2
      ASSIGNED_SYMBOLS: ETH-USD,ETH-INR
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ─── API Gateway & Settlement Service ────────────────────────────

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    command: ["node", "dist/server.js"]
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://vb_user:vb_pass@postgres:5432/velocitybook
      REDIS_URL: redis://redis:6379
      CLUSTER_MODE: "true"
      PORT: "3001"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine-worker-1:
        condition: service_started
      engine-worker-2:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ─── Next.js SSR Frontend ────────────────────────────────────────

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      INTERNAL_API_URL: http://backend:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      NODE_ENV: production
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ─── Prometheus Observability ────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ─── Grafana Dashboards ──────────────────────────────────────────

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  pgdata:
  promdata:
  grafanadata:
